# Entorno local completo: docker compose up --build
# Requiere backend/.env con OPENAI_API_KEY y ANTHROPIC_API_KEY (ver .env.example).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: traductor
      POSTGRES_PASSWORD: traductor
      POSTGRES_DB: traductor
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traductor"]
      interval: 5s

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # S3 local (SeaweedFS; MinIO ya no publica imágenes gratuitas). Sin archivo
  # de identidades acepta cualquier credencial: solo para desarrollo.
  s3:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333
    ports: ["8333:8333"]
    volumes: [s3data:/data]

  crear-bucket:
    image: amazon/aws-cli
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "until aws --endpoint-url http://s3:8333 s3 ls >/dev/null 2>&1; do sleep 1; done;
             aws --endpoint-url http://s3:8333 s3 mb s3://traductor-videos || true"

  api:
    build: ./backend
    env_file: ./backend/.env
    environment: &entorno_docker
      DATABASE_URL: postgres://traductor:traductor@postgres:5432/traductor
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      crear-bucket: { condition: service_completed_successfully }

  worker:
    build: ./backend
    command: node dist/worker.js
    env_file: ./backend/.env
    environment: *entorno_docker
    depends_on: [api]

volumes:
  pgdata:
  s3data:
